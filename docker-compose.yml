services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpaper
      POSTGRES_PASSWORD: workpaper
      POSTGRES_DB: workpaper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpaper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
